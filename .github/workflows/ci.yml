name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ruff (lint + type hints on public functions)
        run: |
          pip install ruff==0.15.8
          ruff check . --output-format github

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16   # postgres:16 + the pgvector extension (Phase 7 knowledge store)
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: dbt build + dbt tests (synthetic dataset, real Postgres)
        # Runs the real dbt project (11 models, all dbt tests) and asserts the marts equal the Python code.
        run: pytest -v tests/test_dbt.py
      - name: Unit, integration, API and dashboard tests
        # Cleaning rules, quality checks, load idempotency, tiering, analyst guardrails and grading,
        # orchestration steps and parity, FastAPI and Streamlit, knowledge base + pgvector retrieval (hash
        # embedder, so no model download) and the Gemini spend guard. No API key is needed or used.
        run: pytest -v --ignore=tests/test_dbt.py
